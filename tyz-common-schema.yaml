  # 反查
  # 符号（开头字符需要和 punctuator/symbols 中的开头字符一致）
  "recognizer/patterns/punct": "^F([0-9]0?|[a-zA-Z]+)$"
  # 简易计算器
  "recognizer/patterns/expression": "^C.*$"

  # 拼写
  # 如果不想让什么标点直接上屏，可以加在下面，或者编辑标点符号为两个及以上的映射。这里 / 用来反查，因此不需要直接上屏
  "speller/alphabet": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA/"

  # 样式
  # 横向布局（用不同设置项兼容不同平台）
  "style/horizontal": true
  "style/candidate_list_layout": linear # linear 横向，stacked 竖向，tabled 表格
  # 边框宽度
  "style/layout/border_width": 1
  # 阴影配置（阴影颜色需要在 preset_color_schemes/xxx/shadow_color 中设置）
  "style/layout/shadow_radius": 2
  "style/layout/shadow_offset_x": 2
  "style/layout/shadow_offset_y": 2

  # 开关
  # 默认英文
  "switches/@0/reset": 1

  # 翻译器
  # 关闭自动补全：大于 4 音节的词条自动补全
  "translator/enable_word_completion": false
  # 显示原始编码
  "translator/preedit_format": []
