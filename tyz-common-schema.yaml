# Rime schema
# encoding: utf-8

patch:
  # 小鹤音形配置
  # 激活码（需要配合 speller/alphabet）
  "aux_code/trigger_word": "/"
  # 展示辅码的模式
  # always:   总是展示(默认)
  # trigger:  输入激活码后激活辅码
  # none:     始终不展示辅码
  "aux_code/show_aux_notice": "trigger"

  # 子方案配置
  # 打开英文自动补全
  "cn_en/enable_completion": true
  "melt_eng/enable_completion": true

  # 语言模型
  "grammar/language": wanxiang-lts-zh-hans
  "grammar/collocation_max_length": 8 # 命中的最长词组
  "grammar/collocation_min_length": 2 # 命中的最短词组，搭配词频健全的词库时候应当最小值设为3避开2字高频词
  "grammar/collocation_penalty": -16 # 对常见搭配词组施加的惩罚值。较高的负值会降低这些搭配被选中的概率，防止过于频繁地出现某些固定搭配。
  "grammar/non_collocation_penalty": -8 # 对非搭配词组施加的惩罚值。较高的负值会降低非搭配词组被选中的概率，避免不合逻辑或不常见的词组组合。
  "grammar/weak_collocation_penalty": -100 # 对弱搭配词组施加的惩罚值。保持默认值通常是为了有效过滤掉不太常见但仍然合理的词组组合。
  "grammar/rear_penalty": -20 # 对词组中后续词语的位置施加的惩罚值。较高的负值会降低某些词语在句子后部出现的概率，防止句子结构不自然。
  # translator 内加载
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  # 候选词个数
  "menu/page_size": 9

  # 数字分隔符：在数字后输入此字符会转换成英文形式，设置成空字符串则禁用此功能
  "punctuator/digit_separators": "."
  # 定义部分全角字符
  "punctuator/full_shape/+":
    "$": ["$", "￥", "€", "£", "¥", "¢", "¤", "₩"]
    "|": ["｜", "·", "§", "¦"]
    "[": ["【", "「", "〔", "［", "〚", "〘"]
    "]": ["】", "」", "〕", "］", "〛", "〙"]
  # 定义部分半角字符
  "punctuator/half_shape/+":
    "$": "¥"
    "[": "【"
    "]": "】"
    "{": "{"
    "}": "}"
    "|": ["|", "·", "・", "｜", "§", "¦", "‖"]
    "'": {pair: ["‘", "’"]}
    "<": "《"
    ">": "》"
    "/": "/"
  # 从 symbols.yaml 复制，仅修改起始字符
